# 랜딩 페이지를 https://lab.hwanyong.com/germ-warfare/ 로 배포한다.
#
# ★ 한때 GitHub Pages 로도 나갔다(blog.hwanyong.com/germ-warfare/). 2026-08-25 에 그 잡을
#   지웠다 — 그 도메인은 이제 Cloudflare 가 서빙하고, 옛 경로는 Worker 가 lab 으로
#   301 한다. Pages 로 올려 봐야 아무도 읽지 않는 산출물이었다.
#   저장소 설정의 Pages 도 같은 날 껐다.
#
# ★ 되돌릴 곳이 없다. 이 잡이 실패하면 사이트는 ★직전 배포에 머문다★ —
#   내려가지는 않지만 새 내용이 나가지 않는다. 실패를 방치하면 조용히 낡는다.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 저장소를 읽는 것뿐이다. Pages 잡을 지우면서 그 잡이 쓰던 쓰기 권한도 함께 걷었다 —
# 쓰지 않는 쓰기 권한을 남겨 두면 워크플로를 뺏겼을 때 넘겨줄 것이 그만큼 늘어난다.
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run build
      # ★ 한때 Pages 전용 업로드 액션이 여기 하나 더 있었다. 그것이 만드는 것은
      #   ★GitHub Pages 전용 형식★ 이라 Cloudflare 잡이 그대로 내려받을 수 없어
      #   일반 아티팩트를 한 벌 더 올려야 했다. Pages 를 버린 뒤로는 이 한 벌뿐이다.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  # ── Cloudflare Workers (lab.hwanyong.com) ────────────────────────────────
  # ★이 잡이 유일한 배포다.★
  # ★ 선행 조건: 저장소 시크릿에 CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID 가
  #   등록되어 있어야 한다.
  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Worker 의 정적 자산은 루트 기준이라 한 겹 넣어 경로를 맞춘다.
      # vite 의 base('/germ-warfare/')와 반드시 같은 이름이어야 한다.
      - name: Arrange assets under the served path
        run: |
          mkdir -p out/germ-warfare
          cp -R dist/. out/germ-warfare/
          cp cloudflare/_headers out/_headers

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
