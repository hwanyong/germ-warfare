# 두 곳으로 나란히 배포한다.
#
#   GitHub Pages  →  blog.hwanyong.com/germ-warfare/   (지금 운영 중인 자리)
#   Cloudflare    →  lab.hwanyong.com/germ-warfare/    (옮겨 갈 자리, 런칭 전까지 noindex)
#
# ★ 런칭 전까지 둘 다 살아 있어야 한다. Pages 쪽을 먼저 끄면 지금 주소가 404 가 되고,
#   그 주소는 이미 색인되어 있다. lab 이 검증된 뒤에 끄는 것이 순서다.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # Cloudflare 잡이 같은 산출물을 쓴다 — 빌드를 두 번 하지 않기 위해 함께 올린다.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # ── Cloudflare Workers (lab.hwanyong.com) ────────────────────────────────
  # ★ 선행 조건: 저장소 시크릿에 CLOUDFLARE_API_TOKEN · CLOUDFLARE_ACCOUNT_ID 가
  #   등록되어 있어야 한다. 없으면 이 잡만 실패하고 Pages 배포는 영향받지 않는다.
  cloudflare:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      # Worker 의 정적 자산은 루트 기준이라 한 겹 넣어 경로를 맞춘다.
      # vite 의 base('/germ-warfare/')와 반드시 같은 이름이어야 한다.
      - name: Arrange assets under the served path
        run: |
          mkdir -p out/germ-warfare
          cp -R dist/. out/germ-warfare/
          cp cloudflare/_headers out/_headers

      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
