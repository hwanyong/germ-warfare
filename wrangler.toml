# wrangler.toml — Cloudflare Workers 정적 자산 배포.
#
# ── GitHub Pages 와 ★함께★ 나간다 ──────────────────────────────────────────
# 이 파일이 생겨도 .github/workflows/deploy.yml 의 GitHub Pages 배포는 그대로 돈다.
# 런칭 전까지 blog.hwanyong.com/germ-warfare/ 가 지금처럼 살아 있어야 하기 때문이다.
# 둘을 동시에 내고, lab 쪽이 검증되면 그때 Pages 를 끈다.
#
# ── 왜 산출물을 한 겹 더 넣는가 ────────────────────────────────────────────
# Worker 의 정적 자산은 ★루트 기준★ 이다. dist/index.html 을 그대로 올리면 그것은
# `/index.html` 이 되어 `/germ-warfare/` 요청과 맞지 않는다. 워크플로가 빌드 후
# out/germ-warfare/ 로 옮겨 담아 경로를 맞춘다 — 그래야 Worker 스크립트가 0줄이고
# (정적 요청은 과금되지 않는다) workers.dev 에서도 실제와 같은 경로로 검증된다.
#
# ── vite 의 base 와 같은 값이다 ────────────────────────────────────────────
# vite.config.js 의 base: '/germ-warfare/' 가 자산 주소를 만든다. 그 값과 여기 담는
# 디렉터리 이름이 어긋나면 자산이 404 가 된다. 호스트가 blog → lab 으로 바뀌어도
# ★이 경로는 바뀌지 않으므로★ vite 설정도 PWA manifest 도 손대지 않는다.
name = "germ-warfare"
compatibility_date = "2026-08-23"

[assets]
directory = "./out"
# 없는 경로는 가장 가까운 404.html 을 404 상태로 낸다. SPA 폴백(모든 경로를 /로)은
# 쓰지 않는다 — 이 게임은 URL 을 바꾸지 않으므로 폴백이 잘못된 200 만 만든다.
not_found_handling = "404-page"
# foo/index.html 을 /foo/ 로 낸다. GitHub Pages 의 디렉터리 서빙과 같은 동작이다.
html_handling = "auto-trailing-slash"

# ── 라우트 ────────────────────────────────────────────────────────────────
# lab.hwanyong.com 에는 더미 A 레코드(192.0.2.1, Proxied)가 있고 실제 응답은 이
# Worker 가 낸다. apex·www 가 쓰는 것과 같은 방식이다.
#
# ★ 경로가 붙은 라우트라 다른 하위 사이트와 충돌하지 않는다 — Cloudflare 는 더
#   구체적인 라우트를 우선한다. 저장소마다 자기 경로만 선언하므로, 사이트를 하나
#   더 붙일 때 기존 저장소를 건드리지 않는다(지금 GitHub Pages 가 그러하듯).
[[routes]]
pattern = "lab.hwanyong.com/germ-warfare/*"
zone_name = "hwanyong.com"
