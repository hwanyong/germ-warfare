<!doctype html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>세균전 | Germ Warfare</title>

	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Dongle:wght@300;400;700&family=Gugi&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet" />

	<!-- 로딩 씬 critical CSS (모듈 CSS/JS 로드 전 즉시 표시) -->
	<style>
		#loading { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center;
			background: #efeee7; color: #2a2a2a; font-family: system-ui, sans-serif;
			transition: opacity .3s; }
		#loading.done { opacity: 0; pointer-events: none; }
		#loading .box { text-align: center; }
		#loading .t { font-size: 1.6rem; letter-spacing: .12em; margin-bottom: 14px; }
		#loading .pct { font-size: 2.2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
		#loading .track { width: 200px; height: 12px; margin: 12px auto 0; overflow: hidden;
			border: 2px solid #2a2a2a; border-radius: 7px; }
		#loading .fill { height: 100%; width: 0; background: #3add8d; transition: width .2s ease; }
	</style>

	<script type="module" defer src="/src/main.mjs"></script>
</head>
<body>
	<div id="app"></div>
	<div id="loading">
		<div class="box">
			<div class="t">🧬 세균전 로딩중</div>
			<div class="pct" id="load-pct">0%</div>
			<div class="track"><div class="fill" id="load-fill"></div></div>
		</div>
	</div>
</body>
</html>
