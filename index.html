<!doctype html>
<html lang="ko">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
	<title>세균전 | Germ Warfare</title>

	<link rel="icon" href="/favicon.ico" sizes="any" />
	<link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16x16.png" />
	<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
	<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
	<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />

	<!-- iOS는 manifest.webmanifest 의 display/theme_color 를 못 읽어 별도 meta 필요 -->
	<meta name="theme-color" content="#efeee7" />
	<meta name="apple-mobile-web-app-capable" content="yes" />
	<meta name="apple-mobile-web-app-status-bar-style" content="default" />
	<meta name="apple-mobile-web-app-title" content="세균전" />

	<!-- 폰트는 self-host (public/assets/fonts/, ADR-011) — 외부 CDN 의존 0 -->

	<!-- Cloudflare Web Analytics — 트래픽 계측, 유일한 의도적 외부 의존(ADR-011 예외).
	     blog.hwanyong.com 전체가 이 토큰 하나로 잡힌다(호스트 단위 집계라 하위 경로도 같은 사이트다).
	     token 은 비밀이 아니다 — 모든 방문자의 HTML 에 그대로 실려 나가는 공개 식별자다.
	     integrity 미적용 — beacon.min.js 는 버전 고정 URL 이 아니라 Cloudflare 가 계속 갱신하는
	     엔드포인트라, 해시를 고정하면 다음 갱신에서 무음으로 로드가 막혀 계측이 영구 정지된다.
	     ★ 이 앱은 씬을 바꿔도 URL 을 바꾸지 않으므로 집계는 진입 1회뿐이다. 비콘의 SPA 추적은
	       history.pushState 패치라, 라우팅을 도입하는 날 별도 계측 코드 없이 저절로 씬별로 잡힌다. -->
	<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "d10ef3756f0a47f48b7896721f153bfa"}'></script>

	<!-- 로딩 씬 critical CSS (모듈 CSS/JS 로드 전 즉시 표시) -->
	<style>
		#loading { position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center;
			background: #efeee7; color: #2a2a2a; font-family: system-ui, sans-serif;
			transition: opacity .3s; }
		#loading.done { opacity: 0; pointer-events: none; }
		#loading .box { text-align: center; }
		#loading .t { font-size: 1.6rem; letter-spacing: .12em; margin-bottom: 14px; }
		#loading .pct { font-size: 2.2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
		#loading .track { width: 200px; height: 12px; margin: 12px auto 0; overflow: hidden;
			border: 2px solid #2a2a2a; border-radius: 7px; }
		#loading .fill { height: 100%; width: 0; background: #3add8d; transition: width .2s ease; }
	</style>

	<script type="module" defer src="/src/main.mjs"></script>
</head>
<body>
	<div id="app"></div>
	<!-- 모바일(폰) 가로모드 차단 — 세로 전용 안내. 표시 조건은 theme.css 미디어쿼리 -->
	<div id="rotate-notice">
		<div class="ph" aria-hidden="true"></div>
		<div class="t">세로 모드로 돌려주세요</div>
		<div class="s">Please rotate to portrait</div>
	</div>
	<div id="loading">
		<div class="box">
			<div class="t">GERM WARFARE</div>
			<div class="pct" id="load-pct">0%</div>
			<div class="track"><div class="fill" id="load-fill"></div></div>
		</div>
	</div>
</body>
</html>
